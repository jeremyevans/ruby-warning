name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, ruby: 2.4 }
          - { os: ubuntu-24.04, ruby: 2.5 }
          - { os: ubuntu-24.04, ruby: 2.6 }
          - { os: ubuntu-24.04, ruby: 2.7 }
          - { os: ubuntu-24.04, ruby: "3.0" }
          - { os: ubuntu-24.04, ruby: 3.1 }
          - { os: ubuntu-26.04, ruby: 3.2 }
          - { os: ubuntu-26.04, ruby: 3.3 }
          - { os: ubuntu-26.04, ruby: 3.4 }
          - { os: ubuntu-26.04, ruby: "4.0" }
    name: ${{ matrix.ruby }}
    env:
      BUNDLE_GEMFILE: .ci.gemfile
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake
